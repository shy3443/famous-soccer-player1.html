<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> 축구선수 이미지 분류 </title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800;900&display=swap');

        /* ✨ 1. 무빙 그라데이션 기본 배경 ✨ */
        body { 
            font-family: 'Pretendard', sans-serif; 
            margin: 0; 
            padding: 40px 20px;
            background: linear-gradient(135deg, #0f172a, #1e3a8a, #0c4a6e, #1e1b4b);
            background-size: 300% 300%;
            animation: gradientBG 15s ease infinite alternate; 
            color: #1e293b; 
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            box-sizing: border-box;
            position: relative; 
            overflow-x: hidden; 
            z-index: 0;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(rgba(255, 255, 255, 0.15) 1.5px, transparent 1.5px);
            background-size: 35px 35px; 
            z-index: -2;
            pointer-events: none;
        }

        .bg-decoration {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1; 
            pointer-events: none; 
            overflow: hidden;
        }

        /* ✨ 2. 몽환적으로 움직이는 빛 무리(오로라/스포트라이트) 효과 추가 ✨ */
        .glowing-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.6;
            animation: moveOrb 20s infinite alternate cubic-bezier(0.4, 0, 0.2, 1);
            z-index: -1;
        }
        
        .orb-1 {
            width: 50vw; height: 50vw;
            background: #38bdf8;
            top: -10%; left: -10%;
            animation-delay: 0s;
        }
        
        .orb-2 {
            width: 40vw; height: 40vw;
            background: #818cf8;
            bottom: -10%; right: -5%;
            animation-duration: 25s;
            animation-delay: -5s;
        }

        .orb-3 {
            width: 35vw; height: 35vw;
            background: #34d399;
            top: 30%; left: 40%;
            animation-duration: 30s;
            animation-delay: -10s;
            opacity: 0.4;
        }

        @keyframes moveOrb {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(10vw, 15vh) scale(1.2); }
            100% { transform: translate(-10vw, -10vh) scale(0.9); }
        }

        /* ✨ 3. 로고 애니메이션 ✨ */
        .bg-logo {
            position: absolute;
            object-fit: contain;
            opacity: 0.25; 
            filter: grayscale(10%) brightness(140%) drop-shadow(0 4px 6px rgba(0,0,0,0.3)); 
            animation: floatAndRotate infinite ease-in-out alternate;
        }

        @keyframes floatAndRotate {
            0% { transform: translateY(0px) rotate(-3deg) scale(1); }
            100% { transform: translateY(-20px) rotate(6deg) scale(1.06); }
        }

        .card {
            background: #ffffff;
            width: 100%;
            max-width: 540px;
            border-radius: 24px;
            padding: 40px 35px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.9);
            text-align: center;
            box-sizing: border-box;
            position: relative;
            z-index: 10; 
        }

        .logo { 
            font-size: 30px; 
            font-weight: 900; 
            background: linear-gradient(135deg, #1e3a8a, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0 0 10px 0; 
            letter-spacing: -0.5px;
        }

        .desc {
            color: #64748b;
            font-size: 16px;
            margin-bottom: 25px;
            font-weight: 600;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }
        
        button, label.upload-btn { 
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            box-shadow: 0 6px 15px rgba(37, 99, 235, 0.3);
            color: #fff; 
            border: none; 
            padding: 16px; 
            border-radius: 14px; 
            cursor: pointer; 
            font-size: 18px; 
            font-weight: 800; 
            transition: all 0.3s ease; 
        }
        button:hover, label.upload-btn:hover { 
            transform: translateY(-3px); 
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.5);
        }
        input[type="file"] { display: none; }
        
        #loading { 
            font-weight: 700; 
            color: #10b981; 
            font-size: 15px; 
            display: none; 
            background: rgba(16, 185, 129, 0.1); 
            padding: 12px; 
            border-radius: 10px; 
        }

        #image-wrapper {
            width: 100%;
            max-height: 550px;
            border-radius: 18px;
            overflow: hidden;
            margin: 0 auto 30px auto;
            display: none;
            background: #f8fafc;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            border: 2px solid #eff6ff;
        }

        #image-preview {
            width: 100%;
            height: 100%;
            max-height: 550px;
            object-fit: contain; 
            display: block;
            transition: transform 0.4s ease; 
        }
        #image-wrapper:hover #image-preview {
            transform: scale(1.03); 
        }

        .info-panel {
            background: #f8fafc;
            border-radius: 20px;
            padding: 30px;
            text-align: left;
            border: 1px solid #e2e8f0;
            display: none;
        }

        .info-panel.active {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .match-rate-box {
            background: #ffffff;
            border: 2px solid #eff6ff;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
        }

        .match-rate-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 12px;
        }
        .match-rate-label { font-size: 16px; font-weight: 800; color: #475569; }
        .match-rate-percent { font-size: 28px; font-weight: 900; color: #2563eb; }
        
        .progress-bg { width: 100%; height: 16px; background: #e2e8f0; border-radius: 8px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #3b82f6, #10b981); width: 0%; border-radius: 8px; transition: width 1s cubic-bezier(0.2, 0.8, 0.2, 1); }

        .info-item {
            display: flex;
            align-items: center;
            margin-bottom: 22px;
        }
        .info-item:last-child { margin-bottom: 0; }
        
        .info-emblem { 
            width: 50px; 
            height: 50px; 
            object-fit: contain; 
            margin-right: 18px; 
            border-radius: 8px; 
            background: #ffffff;
            padding: 4px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.08);
            border: 1px solid #f1f5f9;
        }
        
        .info-text { display: flex; flex-direction: column; }
        .info-label { font-size: 14px; color: #64748b; font-weight: 700; margin-bottom: 4px; }
        .info-val { font-size: 22px; font-weight: 800; color: #0f172a; word-break: keep-all; }
        
        .name-val { font-size: 26px !important; color: #1e3a8a !important; }
        .award-val { color: #2563eb !important; font-size: 20px !important; }

    </style>
</head>

    </div>

        </div>

        </div>

        </div>

            </div>
        </div>

    </div>
</div>

    // ✨ 중앙을 비우지 않고 전체 영역을 꽉 채우는 방식으로 변경! ✨
    // 중앙에 생성되는 로고는 불투명한 하얀색 카드 뒤로 자연스럽게 숨겨집니다.
    function createBackgroundLogos() {
        const bgContainer = document.getElementById('bgDecoration');
        
        // 빛 무리 효과가 지워지지 않도록 로고만 추가
        const orbs = bgContainer.innerHTML; 
        bgContainer.innerHTML = orbs;

        const cols = 9;  // 촘촘하게 9칸
        const rows = 6;  // 세로로 6칸
        const cellWidth = 100 / cols;
        const cellHeight = 100 / rows;

        let logoIndex = 0;

        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                
                // ❌ 이전처럼 화면 가운데를 강제로 비우는 코드를 삭제했습니다.
                // 하얀색 메인 카드가 중앙의 로고들을 가려주므로, 테두리가 완벽하게 채워집니다.

                let img = document.createElement('img');
                img.src = backgroundSafeLogos[logoIndex % backgroundSafeLogos.length];
                logoIndex++;
                img.className = 'bg-logo';

                img.onerror = function() {
                    this.style.display = 'none';
                };

                let randomX = (c * cellWidth) + (1 + Math.random() * (cellWidth - 10));
                let randomY = (r * cellHeight) + (1 + Math.random() * (cellHeight - 10));

                img.style.left = randomX + '%';
                img.style.top = randomY + '%';

                img.style.animationDelay = (Math.random() * 5) + 's';
                img.style.animationDuration = (5 + Math.random() * 5) + 's';

                let size = 70 + Math.random() * 35; // 크고 시원시원한 로고 사이즈 유지
                img.style.width = size + 'px';
                img.style.height = size + 'px';

                bgContainer.appendChild(img);
            }
        }
    }

    window.onload = createBackgroundLogos;

    async function init() {
        const loadingDiv = document.getElementById("loading");
        const initBtn = document.getElementById("initBtn");
        
        initBtn.style.display = "none";
        loadingDiv.style.display = "block";
        
        try {
            const modelURL = URL + "model.json";
            const metadataURL = URL + "metadata.json";
            model = await tmImage.load(modelURL, metadataURL);
            maxPredictions = model.getTotalClasses();
            
            loadingDiv.innerText = "✨ 준비 완료! 선수의 사진을 업로드하세요.";
            setTimeout(() => { loadingDiv.style.display = "none"; }, 1500);
            document.getElementById("upload-section").style.display = "block";
        } catch (e) {
            loadingDiv.style.color = "#ef4444";
            loadingDiv.innerText = "문제가 생겼습니다. 새로고침 후 다시 시도해주세요.";
        }
    }

    function previewAndPredict(input) {
        if (input.files && input.files[0]) {
            document.getElementById("info-panel").classList.remove("active");
            document.getElementById("res-prob-bar").style.width = "0%";

            const reader = new FileReader();
            reader.onload = function(e) {
                const imgElement = document.getElementById('image-preview');
                const imgWrapper = document.getElementById('image-wrapper');
                
                imgElement.src = e.target.result;
                imgWrapper.style.display = 'block'; 
                
                imgElement.onload = () => predict(imgElement);
            };
            reader.readAsDataURL(input.files[0]);
        }
    }

    async function predict(imgElement) {
        const prediction = await model.predict(imgElement);
        let highestProb = 0;
        let bestClass = "";

        for (let i = 0; i < maxPredictions; i++) {
            if (prediction[i].probability > highestProb) {
                highestProb = prediction[i].probability;
                bestClass = prediction[i].className;
            }
        }

        displayResult(bestClass, highestProb);
    }

    function displayResult(className, probability) {
        let matchedName = "정보를 찾을 수 없습니다";
        let pData = { nation: "-", club: "-", role: "-", awards: "-" };

        for (const name in players) {
            if (className.includes(name)) {
                matchedName = name;
                pData = players[name];
                break;
            }
        }

        document.getElementById("res-name").innerText = matchedName;
        document.getElementById("res-nation").innerText = pData.nation;
        document.getElementById("res-club").innerText = pData.club;
        document.getElementById("res-role").innerText = pData.role;
        document.getElementById("res-awards").innerText = pData.awards;
        
        const nationImgSrc = nationFlags[pData.nation] || "https://cdn-icons-png.flaticon.com/512/861/861512.png";
        
        const cleanClubName = pData.club.trim();
        const clubImgSrc = clubLogos[cleanClubName] || "https://cdn-icons-png.flaticon.com/512/861/861512.png";
        
        document.getElementById("res-nation-img").src = nationImgSrc;
        document.getElementById("res-club-img").src = clubImgSrc;

        const probValue = (probability * 100).toFixed(1);
        document.getElementById("res-prob-text").innerText = probValue + "%";
        
        document.getElementById("info-panel").classList.add("active");

        setTimeout(() => {
            document.getElementById("res-prob-bar").style.width = probValue + "%";
        }, 100);
    }
</script>
